<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>결 — 글쓰기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--sub:#8b8b8b;--line:#ececec;--card:#f5f5f5;--paper:#fafafa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#f2f2f2;--sub:#7d7d7d;--line:#242424;--card:#1a1a1a;--paper:#161616}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#f2f2f2;--sub:#7d7d7d;--line:#242424;--card:#1a1a1a;--paper:#161616}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:0}
button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:14px 20px 10px;min-height:60px}
.top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;flex:1}
.pill{background:var(--fg);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;white-space:nowrap}
.pill:hover{opacity:.85}
.ic{font-size:28px;line-height:1;width:36px;height:36px;border-radius:50%;color:var(--fg);flex:none}
.ic:hover,.txt:hover{background:var(--card)}
.bt{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.list{padding:8px 20px 24px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.card{background:var(--card);border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.card:hover{transform:translateY(-1px)}.card:active{transform:scale(.98)}
.card b{font-size:17px;letter-spacing:-.02em}.card span{font-size:13px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;margin-top:30vh;line-height:1.7}
.tabs{display:flex;gap:6px;padding:4px 20px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--fg);color:var(--bg)}
.ct{padding:6px 20px;font-size:24px;font-weight:700;letter-spacing:-.03em;width:100%}
#tx{flex:1;padding:8px 20px 20px;font-size:17px;line-height:1.85;resize:none;width:100%;word-break:keep-all}
::placeholder{color:var(--sub);opacity:.7}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);flex:none}
.txt{font-size:12px;color:var(--sub);padding:6px 10px;border-radius:8px}
.pg{flex:1;text-align:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;display:flex;align-items:stretch;gap:6px;padding:0 12px 14px}
.nav{flex:none;width:36px;align-self:center;height:72px;border-radius:12px;color:var(--sub);font-size:24px}
.nav:hover{background:var(--card);color:var(--fg)}
@media (hover:none){.nav{display:none}}
.bk{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 0;scrollbar-width:none}
.bk::-webkit-scrollbar{display:none}
.col{position:relative;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;font-size:var(--fs,16px);line-height:1.95;word-break:keep-all}
.col p,.col h2,.col h3,.col .tr,.cover{padding-inline:26px}
.col p{margin:0;text-align:justify;text-indent:1em}
.col h2{margin:0 0 1.2em;font-size:1.35em;letter-spacing:-.02em}
.col h3{margin:0 0 1em;font-size:1.1em}
.chap{break-before:column}
.toc{break-after:column}
.tr{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-bottom:1px solid var(--line);font-size:.92em}
.tr i{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums}
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;break-after:column}
.cover small{letter-spacing:.3em;color:var(--sub);font-size:11px}
.cover h1{font-size:1.9em;margin:.6em 0;letter-spacing:-.03em;line-height:1.4}
.cover p{color:var(--sub);font-size:.8em;margin:0;text-indent:0}
.intro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fi .4s ease both}
.intro h1{font-family:"Noto Serif KR",serif;font-size:84px;font-weight:600;margin:0;letter-spacing:-.04em}
.intro p{margin:0;color:var(--sub);font-size:14px;letter-spacing:.12em}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{margin:4px 20px 18px;padding:24px 22px;border-radius:24px;background:var(--card)}
.hero small{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:7px}
.hero small:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.hero h2{margin:8px 0 14px;font-size:24px;letter-spacing:-.03em}
.ctoc{display:flex;flex-direction:column}
.ctoc button{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;font-size:15px}
.ctoc button span:last-child{color:var(--sub);font-size:13px}
.ctoc .cur{font-weight:700}
.sec{margin:0 20px 8px;font-size:13px;color:var(--sub)}
.hero .pill{margin-top:16px;width:100%;padding:13px}
.stage{perspective:2200px;position:relative}
.leaf{position:absolute;transform-style:preserve-3d;transform-origin:left center;pointer-events:none;z-index:5}
.lfi,.lb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 0 28px rgba(0,0,0,.22)}
.lfi{overflow:hidden;padding:28px 0}
.lb{transform:rotateY(180deg)}
.bk{overflow-x:hidden;touch-action:pan-y}
#app{position:relative}
.gear{position:absolute;left:16px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.opts{background:var(--card);border-radius:20px;overflow:hidden}
.opt{display:flex;justify-content:space-between;width:100%;padding:16px 18px;font-size:16px;text-align:left}
.opt+.opt{border-top:1px solid var(--line)}
.opt.on{font-weight:700}
.opt i{font-style:normal}
input[type=range]{accent-color:var(--fg)}
.intro h1{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:96px;letter-spacing:0;display:flex;align-items:baseline;min-height:1.3em}
.intro .cu{font-weight:400;margin-left:3px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.intro p{opacity:0;animation:fi .5s .8s ease both}
.intro h1{font-family:inherit;font-weight:700;letter-spacing:-.04em}
.shb{position:absolute;right:16px;bottom:18px;padding:12px 20px}
.row{margin-bottom:6px}
.bks{display:flex;align-items:flex-end;gap:5px;padding:0 24px;min-height:200px}
.sp{flex:none;padding-top:12px;border-radius:3px 3px 1px 1px;writing-mode:vertical-rl;font-weight:700;font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 10px 0 -7px rgba(255,255,255,.28),inset 0 -10px 0 -7px rgba(255,255,255,.28),2px 0 6px rgba(0,0,0,.14);transition:transform .25s}
.sp.pull{transform:translateY(-16px) scale(1.04)}
.board{height:12px;margin:0 12px 24px;border-radius:2px;background:linear-gradient(var(--line),var(--card));box-shadow:0 6px 10px rgba(0,0,0,.1)}
:root{--case:#cfcfcf;--back:#e6e6e6;--wood:#b9b9b9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--case:#2c2c2c;--back:#151515;--wood:#3b3b3b}}
:root[data-theme="dark"]{--case:#2c2c2c;--back:#151515;--wood:#3b3b3b}
.cs{margin:0 16px;border:10px solid var(--case);border-radius:6px;background:var(--back);box-shadow:0 12px 30px rgba(0,0,0,.18),inset 0 0 18px rgba(0,0,0,.25)}
.cell{position:relative;padding-top:16px;box-shadow:inset 0 14px 14px -12px rgba(0,0,0,.3)}
.bks{display:flex;align-items:flex-end;gap:2px;padding:0 12px;min-height:190px}
.pl{height:14px;margin:0 -10px;background:linear-gradient(var(--case),var(--wood));box-shadow:0 4px 8px rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.35)}
.sp{border-radius:2px 2px 0 0;font-size:12px;letter-spacing:.04em;box-shadow:inset 0 8px 0 -6px rgba(255,255,255,.3),inset 0 -8px 0 -6px rgba(255,255,255,.3),3px 0 5px rgba(0,0,0,.28)}
:root{--case:#f7f7f7;--back:#e9e9e9;--wood:#d6d6d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--case:#2b2b2b;--back:#1a1a1a;--wood:#3a3a3a}}
:root[data-theme="dark"]{--case:#2b2b2b;--back:#1a1a1a;--wood:#3a3a3a}
.cs{margin:0 18px;border:12px solid var(--case);border-bottom-width:0;border-radius:0;background:var(--back);outline:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.cell{padding-top:14px;box-shadow:inset 0 12px 12px -12px rgba(0,0,0,.16)}
.bks{padding:0 10px;gap:2px;min-height:176px}
.pl{position:relative;height:10px;margin:0;background:var(--case);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 2px 3px rgba(0,0,0,.1)}
.pl::before,.pl::after{content:"";position:absolute;top:13px;width:4px;height:4px;border-radius:50%;background:var(--wood)}
.pl::before{left:6px}.pl::after{right:6px}
.base{margin:0 30px;height:18px;background:var(--case);outline:1px solid var(--line);border-top:2px solid var(--wood);box-shadow:0 8px 14px -6px rgba(0,0,0,.25)}
.sp{border-radius:1px;box-shadow:inset 0 7px 0 -6px rgba(255,255,255,.35),inset 0 -7px 0 -6px rgba(255,255,255,.35),1px 0 0 rgba(0,0,0,.18)}
.sh{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh-p{position:relative;width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:8px;animation:fi .25s}
.sh-p b{font-size:17px;margin-bottom:6px;letter-spacing:-.02em}
.sh-p button{background:var(--card);border-radius:16px;padding:16px;font-size:16px;font-weight:600;text-align:left}
.sh-p button.x{color:var(--sub);background:none;text-align:center;font-weight:500}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;animation:fi .3s}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let S=null;
try{S=JSON.parse(localStorage.getItem('gyeol1'))}catch(e){}
if(!S||!S.books)S={books:[],cur:null,ci:0,fs:16};
let view='intro',armed=false,A=null;
const save=()=>{try{localStorage.setItem('gyeol1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const book=()=>S.books.find(b=>b.id===S.cur);
const cnt=b=>b.ch.reduce((n,c)=>n+c.b.replace(/\s/g,'').length,0);
const go=v=>{view=v;armed=false;R()};

const SN=['소리 끔','청축','백축','갈축','무접점','청해축','심해축','딥치즈축'];
const AC=()=>A||(A=new(window.AudioContext||window.webkitAudioContext)());
function tick(key){const p=S.snd||0;if(!p)return;try{const c=AC();if(c.state==='suspended')c.resume();const t=c.currentTime,K=KV(),big=key===' '||key==='Enter'||key==='Backspace',pf=big?(key===' '?.62:.75):1,j=.95+Math.random()*.1;
 const N=(o,type,f,q,g,d)=>{const n=Math.floor(c.sampleRate*(d+.02)),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const F=c.createBiquadFilter();F.type=type;F.frequency.value=f*pf*j;F.Q.value=q;const G=c.createGain();G.gain.setValueAtTime(.0001,t+o);G.gain.linearRampToValueAtTime(g*K,t+o+.002);G.gain.exponentialRampToValueAtTime(.0001,t+o+d);s.connect(F);F.connect(G);G.connect(c.destination);s.start(t+o);s.stop(t+o+d+.02)};
 const T=(o,type,f0,f1,g,d)=>{const x=c.createOscillator(),G=c.createGain();x.type=type;x.frequency.setValueAtTime(f0*pf*j,t+o);x.frequency.exponentialRampToValueAtTime(f1*pf*j,t+o+d);G.gain.setValueAtTime(.0001,t+o);G.gain.linearRampToValueAtTime(g*K,t+o+.002);G.gain.exponentialRampToValueAtTime(.0001,t+o+d);x.connect(G);G.connect(c.destination);x.start(t+o);x.stop(t+o+d+.01)};
 if(p===1){N(0,'bandpass',5200,6,.9,.03);T(0,'square',3400,2600,.12,.012);N(.045,'bandpass',2300,2.5,.8,.05);T(.045,'triangle',260,140,.3,.06)}
 else if(p===2){N(0,'highpass',3200,.7,.55,.014);T(0,'sine',1900,1300,.14,.02);T(.004,'sine',320,200,.15,.035)}
 else if(p===3){N(0,'bandpass',1000,1.1,.55,.05);T(0,'sine',210,105,.5,.075);N(.022,'lowpass',700,.8,.3,.04)}
 else if(p===4){T(0,'sine',130,52,.95,.15);N(0,'lowpass',420,.7,.45,.09);T(.03,'sine',95,60,.35,.1)}
 else if(p===5){N(0,'highpass',6500,.6,.5,.03);T(0,'sine',2600,1700,.16,.03);N(.03,'bandpass',4800,3,.35,.06);T(.03,'sine',1500,1100,.1,.05)}
 else if(p===6){T(0,'sine',320,720,.4,.07);T(.05,'sine',480,980,.3,.06);T(.1,'sine',260,620,.25,.07);N(0,'lowpass',600,.8,.15,.05)}
 else{T(0,'sine',160,70,.6,.16);T(.02,'sine',100,48,.7,.22);N(0,'lowpass',320,2,.5,.12);T(.1,'sine',90,200,.25,.1)}
}catch(e){}}
function tickOld(){const p=S.snd||0;if(!p)return;try{const c=AC();if(c.state==='suspended')c.resume();const t=c.currentTime;
 const N=(o,f,q,g,d)=>{const n=Math.floor(c.sampleRate*.06),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const F=c.createBiquadFilter();F.type='bandpass';F.frequency.value=f*(.94+Math.random()*.12);F.Q.value=q;const G=c.createGain();G.gain.setValueAtTime(g*KV(),t+o);G.gain.exponentialRampToValueAtTime(.001,t+o+d);s.connect(F);F.connect(G);G.connect(c.destination);s.start(t+o);s.stop(t+o+.06)};
 const T=(f0,f1,g,d)=>{const o=c.createOscillator(),G=c.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);G.gain.setValueAtTime(g*KV(),t);G.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(G);G.connect(c.destination);o.start(t);o.stop(t+d)};
 if(p===1){N(0,4200,3,.5,.025);N(.022,3000,2,.35,.03);T(220,120,.25,.05)}
 else if(p===2){N(0,3000,2,.3,.03);T(200,110,.2,.05)}
 else if(p===3){N(0,1500,1.2,.35,.04);T(170,90,.3,.06)}
 else{T(140,70,.55,.09);N(0,700,.8,.25,.05)}
}catch(e){}}
function swish(){if(S.ps===0)return;try{const c=AC(),n=Math.floor(c.sampleRate*.4),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const F=c.createBiquadFilter();F.type='bandpass';F.Q.value=.7;const t=c.currentTime;F.frequency.setValueAtTime(900,t);F.frequency.exponentialRampToValueAtTime(3200,t+.35);const G=c.createGain();G.gain.setValueAtTime(.001,t);G.gain.linearRampToValueAtTime(.12*KV(),t+.12);G.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(F);F.connect(G);G.connect(c.destination);s.start(t)}catch(e){}}
function R(){const a=$('#app');if(view==='intro'){a.innerHTML='<div class="intro"><h1><span id="ty"></span><b class="cu">_</b></h1><p>써내려가는 시간</p></div>';['ㄱ','겨','결'].forEach((s,i)=>setTimeout(()=>{const e=$('#ty');if(e)e.textContent=s},200+i*200));const n=()=>{if(view==='intro')go('lib')};a.onclick=n;setTimeout(n,1700);return}a.onclick=null;if(view==='lib'){lib(a);a.insertAdjacentHTML('beforeend','<button class="gear" id="gr" aria-label="설정">'+GEAR+'</button>');$('#gr').onclick=()=>go('set');a.insertAdjacentHTML('beforeend','<button class="pill shb" id="sh">책장</button>');$('#sh').onclick=()=>go('shelf')}else if(view==='ed')ed(a);else if(view==='set')setPage(a);else if(view==='shelf')shelf(a);else bk(a)}
const GEAR='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const KV=()=>(S.vol??.7)/.7;
function shelf(a){
 const B=S.books,P=[['#111','#f2f2f2'],['#2e2e2e','#f2f2f2'],['#e6e6e6','#111'],['#8a8a8a','#fff'],['#4a4a4a','#f2f2f2'],['#cfcfcf','#111']],rows=[];
 for(let i=0;i<B.length;i+=6)rows.push(B.slice(i,i+6));

 const B=(o,f0,f1,g,d)=>{const x=c.createOscillator(),G=c.createGain();x.frequency.setValueAtTime(f0*j,t+o);x.frequency.exponentialRampToValueAtTime(f1*j,t+o+d);G.gain.setValueAtTime(.0001,t+o);G.gain.linearRampToValueAtTime(g*K,t+o+.004);G.gain.exponentialRampToValueAtTime(.0001,t+o+d);x.connect(G);G.connect(M);x.start(t+o);x.stop(t+o+d+.01)};
 const th=(o,fs,g,d)=>fs.forEach((f,i)=>RG(o,f,6+i*2,g/(1+i*.5),d));
 if(sp&&p!==4)RG(.02,2000,5,.12,.012);
 if(p===1){RG(0,4200,14,.55,.03);N(0,'highpass',3500,.7,.25,.004);RG(.004,3100,12,.4,.025);N(.05,'lowpass',1800,.7,.5,.014);th(.05,[240,480,900],.7,.07);RG(.115,3600,14,.2,.018)}
 else if(p===2){RG(0,2400,8,.18,.015);N(.04,'lowpass',1500,.7,.4,.012);th(.04,[260,520,1100],.55,.06);RG(.1,3000,10,.1,.012)}
 else if(p===3){N(0,'lowpass',900,.7,.25,.015);RG(0,700,5,.25,.025);N(.045,'lowpass',1300,.7,.45,.014);th(.045,[200,400,760],.7,.075);RG(.105,2200,10,.08,.012)}
 else if(p===4){N(.03,'lowpass',450,.7,.6,.03);th(.03,[120,190,300,80],.9,.12);RG(.1,500,6,.15,.04)}
 else if(p===5){RG(0,5200,16,.5,.025);N(0,'highpass',5500,.6,.3,.01);N(.035,'lowpass',1600,.7,.4,.012);th(.035,[300,560,1400],.55,.06);N(.1,'highpass',6000,.5,.12,.03)}
 else if(p===6){N(.03,'lowpass',1100,.7,.4,.012);th(.03,[220,420,800],.6,.08);B(.012,320,760,.2,.06);B(.06,460,980,.16,.05);B(.1,280,680,.13,.06);N(.02,'lowpass',650,.8,.12,.07)}
 else{N(.03,'lowpass',380,.7,.6,.04);th(.03,[90,140,220],1,.16);N(.05,'bandpass',700,2,.2,.06);B(.07,95,230,.2,.1)}
}catch(e){}}
function shelf(a){
 const B=S.books.filter(b=>b.shelved),P=[['#111','#f2f2f2'],['#2e2e2e','#f2f2f2'],['#e6e6e6','#111'],['#8a8a8a','#fff'],['#4a4a4a','#f2f2f2'],['#cfcfcf','#111'],['#1c1c1c','#ddd'],['#b5b5b5','#111']],RN=Math.max(4,Math.ceil(B.length/6));
 let h='';
 for(let ri=0;ri<RN;ri++){const r=B.slice(ri*6,ri*6+6);
  h+=`<div class="cell"><div class="bks">${r.map((b,i)=>{const k=ri*6+i,w=26+Math.min(16,b.ch.length*4),ht=118+Math.min(56,Math.floor(cnt(b)/150))+(k*37)%16,c=P[(k*3+ri)%P.length],lean=r.length>1&&r.length<6&&i===r.length-1;return `<button class="sp" data-id="${b.id}" style="width:${w}px;height:${ht}px;line-height:${w}px;background:${c[0]};color:${c[1]};${lean?'rotate:-7deg;transform-origin:bottom right;':''}">${esc(b.title||'제목 없음')}</button>`}).join('')}</div><div class="pl"></div></div>`}
 a.innerHTML=`<header class="top"><button class="ic" id="back" aria-label="뒤로">‹</button><h1 style="font-size:20px">책장</h1></header><div style="overflow:auto;flex:1;padding:8px 0 24px"><div class="cs">${h}</div><div class="base"></div><p class="sec" style="text-align:center;margin:18px 28px;line-height:1.6">${B.length?B.length+'권':'홈에서 글을 눌러 \'책장에 반영하기\'를 선택하면 여기에 꽂혀요.'}</p></div>`;
 $('#back').onclick=()=>go('lib');
 a.querySelectorAll('.sp').forEach(s=>s.onclick=()=>{s.classList.add('pull');setTimeout(()=>{const id=s.dataset.id,k=S.books.findIndex(x=>x.id===id),m=S.books.splice(k,1)[0];S.books.unshift(m);S.cur=id;S.ci=0;save();go('ed')},260)});
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#app').appendChild(e);setTimeout(()=>e.remove(),1600)}
function sheet(id){const b=S.books.find(x=>x.id===id);if(!b)return;const o=document.createElement('div');o.className='sh';o.innerHTML=`<div class="sh-bg"></div><div class="sh-p"><b>${esc(b.title||'제목 없음')}</b><button id="s1">이어서 쓰기</button><button id="s2">${b.shelved?'책장에서 빼기':'책장에 반영하기'}</button><button class="x" id="s3">닫기</button></div>`;$('#app').appendChild(o);const cl=()=>o.remove();o.querySelector('.sh-bg').onclick=cl;$('#s3').onclick=cl;$('#s1').onclick=()=>{cl();const k=S.books.findIndex(x=>x.id===id),m=S.books.splice(k,1)[0];S.books.unshift(m);S.cur=id;S.ci=0;save();go('ed')};$('#s2').onclick=()=>{b.shelved=!b.shelved;save();cl();R();toast(b.shelved?'책장에 꽂았어요':'책장에서 빼었어요')}}
R();
</script>
